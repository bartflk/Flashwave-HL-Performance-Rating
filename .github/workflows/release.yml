# The Linux build: an AppImage and a .deb, attached to the release.
#
# Windows releases are built and signed on the maintainer's PC
# (`npm run release`, docs/releasing.md), which is where the update key
# lives. Linux cannot be built there, so this builds it on GitHub once the
# release exists, and attaches it to the same release:
#
#   1. Publish the Windows release as usual (`gh release create v<version> ...`).
#      Creating the tag starts this workflow.
#   2. Wait ~15 minutes. The AppImage and the .deb appear on the release.
#   3. With the TAURI_SIGNING_PRIVATE_KEY secret set, the AppImage is signed
#      and a `linux-x86_64` entry is added to the release's latest.json, so
#      AppImage installs update themselves. Without it the files are still
#      attached, and Linux users update by downloading.
#
# Run it by hand from the Actions tab to rebuild the Linux files for the
# version in src-tauri/tauri.conf.json.
name: Linux release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner: an AppImage runs on systems at least as
    # new as the one it was built on, so older is wider.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Version
        run: echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      # Without the key the build cannot sign updater files, and asking for
      # them anyway fails the whole build (it did on every Windows run of
      # this workflow from 0.4.1 to 0.7.0). So they are asked for only when
      # the key is there.
      - name: Build the AppImage and the .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            npx tauri build --bundles appimage,deb
          else
            npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # The AppImage carries this runner's Wayland, xcb and xkbcommon
      # libraries. On a newer desktop (NixOS, Arch, Fedora) they are older than
      # the system's graphics stack and the window opens with a blank webview.
      # Taking them out makes the app use the system's own, which every GTK
      # desktop has. The build signed the original, so it is signed again.
      - name: Use the system display libraries in the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          root=$PWD
          cd target/release/bundle/appimage
          appimage=$(ls *.AppImage | head -n 1)
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1 \
                     libwayland-server.so.0 libXau.so.6 libXdmcp.so.6 libxkbcommon.so.0 \
                     libxcb-randr.so.0 libxcb-render.so.0 libxcb-shm.so.0; do
            find squashfs-root -name "$lib" -print -delete
          done
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$appimage"
          rm -rf squashfs-root appimagetool
          cd "$root"
          if [ "$HAS_KEY" = "true" ]; then
            npx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" "target/release/bundle/appimage/$appimage"
          fi

      # The tag can arrive a moment before the release it belongs to.
      - name: Wait for the release
        run: |
          for i in $(seq 1 60); do
            gh release view "v$VERSION" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "No release v$VERSION after 30 minutes. Publish it, then run this workflow by hand." >&2
          exit 1

      - name: Attach the Linux files
        run: |
          shopt -s nullglob
          files=(target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig target/release/bundle/deb/*.deb)
          printf '%s\n' "${files[@]}"
          gh release upload "v$VERSION" "${files[@]}" --clobber

      # Merge, never replace: latest.json already holds the Windows entry
      # written by `npm run release`.
      - name: Add Linux to latest.json
        if: env.HAS_KEY == 'true'
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          name=$(basename "$appimage")
          sig=$(cat "$appimage.sig")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$name"
          gh release download "v$VERSION" --pattern latest.json --dir manifest
          jq --arg sig "$sig" --arg url "$url" \
            '.platforms["linux-x86_64"] = { signature: $sig, url: $url }' \
            manifest/latest.json > latest.json
          cat latest.json
          gh release upload "v$VERSION" latest.json --clobber
