# Builds the Windows installers and attaches them to a draft release.
#
# Trigger: push a tag like v0.1.0-beta (bump the version in src-tauri/tauri.conf.json
# and the root Cargo.toml first), or run it by hand from the Actions tab.
# The installers' own version stays numeric (MSI allows nothing else); the
# "-beta" lives in the tag and the release name.
# The release is created as a draft pre-release: review it, then publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Flashwave.tf __VERSION__
          releaseBody: |
            Windows only. Download the `-setup.exe` below and run it.

            Windows may say "Windows protected your PC" because the installer is not code-signed: click **More info, then Run anyway**.

            **Updating from an earlier version keeps your data.** Install over the top; your logs, demos index and ratings stay where they are. The app also keeps the newest five copies of its database in a `backups` folder beside it.

            **Uninstalling can remove it.** The uninstaller offers a "Delete the application data" checkbox; leave it unticked unless you mean it, and note that it removes those backups too.

            **Going back to an older version does not work** once this one has opened your database: the older build does not know the new tables. Restore a backup if you need to.

            See the README for first-run steps. Feedback is welcome in Issues.
          releaseDraft: true
          prerelease: true
