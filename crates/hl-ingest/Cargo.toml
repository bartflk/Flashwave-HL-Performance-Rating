[package]
name = "hl-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fetching and normalizing match data from trends.tf and logs.tf"

[dependencies]
hl-core.workspace = true
hl-db.workspace = true
hl-rating.workspace = true
hl-demos.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "fs", "io-util"] }
tracing.workspace = true
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
