# 6v6 rating weights: the starting set (the 6v6 plan, "The weights,
# explained"), one table a role and one an off-class. The numbers are each
# component's share of the rating, as proposed for the reviewers to argue;
# they are fitted against who won once the 6v6 league sample exists (P5, P6).
#
# Components not measured yet are left out and the rest scaled up, the same
# rule as a Highlander component a log did not record:
#   round_impact      until 6v6's round-win table is measured on the league
#                     sample's raw logs (300 rounds): then it counts, by itself
#   space             Flashy's definition (question 17): going in first, high
#                     ground and forward positions, taking most of the damage
#                     and attention. Measured now as the share of the team's
#                     damage taken (the Medic's left out); going in first and
#                     positions join it later (raw logs, demos)
#   forces            needs an agreed definition (the reviewers)
#   opening           first kills of a fight: needs every log's raw log
#   untraded_deaths   needs every log's raw log
#   backcaps, saps, denies, protect, spychecks, building_life, build_speed,
#   caps_contested, survival
# So until then the preview rates on the rest, against the other players in
# your own stored 6v6 logs: a preview, not the 6v6 rating.

# s1 (15 Nov 2026, Flashy chose option A): the role tables' measured components
# fitted to who won on the logs.tf database's 63,959 6v6 officials (hl sixes-fit),
# with guard rails -- round impact and the components logs cannot measure yet
# keep their weight, and a death measure is capped at a quarter of the fitted
# block (the losing side dies more; uncapped it rated the result, not the
# play). Against who won: team 88.8% -> 89.9%, every role up (docs/sixes.md).
