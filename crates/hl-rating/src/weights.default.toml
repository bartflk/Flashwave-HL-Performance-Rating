# Rating weights.
#
# These are the defaults compiled into the app. To tune them, copy this file to
#   %APPDATA%\gg.highlander.rating\weights.toml
# and edit it there. The match page re-reads it every time a match is opened;
# the profile updates after the next sync or "Rebuild from stored data".

# What killing a player on each class is worth. Medic highest: a Medic pick
# decides fights. v2, reviewed with a Premiership Sniper: Pyro and Spy were
# undervalued, and Scout belongs above Engineer outside stopwatch defence.
# Per-map and per-side values are planned (PLAN.md, "Victim values v2").
# What killing each class is worth, before the map, the side and the state of
# the fight adjust it. These are the model's opinion about who matters, and
# every one of them should be arguable from how Highlander is played -- see
# docs/highlander.md for the roles they come from.
#
# MEASURED TWICE, September 2026. boSe suggested that killing a Scout is
# worth more on KOTH, because there the Scout is in the übered push rather
# than off on a flank.
#
# The first attempt asked whether raising the value changed how often the
# rating picked the winning team. Five values from 1.15 to 2.5 all gave the
# same answer, and the test could not have worked anyway: Scout kills are a
# ninth of a Sniper's and reach the rating through one component. Redone
# after Q8 across all nine models, 1.4 / 1.7 / 2.0 / 2.5 on koth_ maps move
# the nine accuracies by +0.7 (Soldier) to -0.8 (Engineer) and the total by
# less than half a point in either direction, with no trend.
#
# The second attempt measured the claim directly (`hl situation --victims`):
# for every kill, how often the killer's team went on to win the round, less
# what the situation alone predicted, per victim class and per mode, each
# mode against its own baseline. 71,808 KOTH kills and 38,931 stopwatch.
#
#   KOTH, excess round-win chance from the kill, mode average +6.2%:
#     medic +10.7   pyro +7.1   demoman +7.4   heavy +6.2   sniper +6.1
#     scout +6.0    engineer +5.9   soldier +4.6   spy +4.4
#
#   Stopwatch, mode average -1.9%:
#     scout +1.1    medic -0.1   spy -0.4   sniper -0.8   heavy -1.6
#     soldier -2.1   pyro -3.1   demoman -3.9   engineer -7.5
#
# The Scout is the average class to kill on KOTH (-0.2 against the mode, well
# inside a standard error of 0.55) and the *best* class to kill on stopwatch
# (+3.0 against the mode, about four standard errors). That is not boSe's
# effect weakened; it is the opposite of it. A guess at why: on payload the
# Scout is the one who gets back to the cart, and killing him is what stops
# the last push.
#
# Not applied, and the stopwatch half is not applied either, because the
# label that column is measured against is weak: a stopwatch round is won on
# the clock, and the mode's average kill lowers the killer's round-win chance
# (-1.9%), which no honest reading of Highlander supports. The KOTH column is
# the trustworthy one, and on KOTH the Scout is ordinary.
#
# What both attempts really show: `hl validate` cannot feel this table. The
# Medic's own KOTH premium is the largest effect here by a distance (+10.7
# against a +6.2 average, which would argue for 3.0 -> 3.6 on KOTH) and
# raising it moves the nine accuracies by -0.4 points in total. These values
# are an argued opinion about who matters, held to the eye test and to
# docs/highlander.md, and the win-prediction test is not sensitive enough to
# settle them. See Q8b in PLAN §13.
[victim_value]
medic    = 3.0
demoman  = 2.2
sniper   = 1.8   # denying the enemy Sniper's picks
pyro     = 1.5   # with their Pyro dead, your team can spam freely
heavy    = 1.4
spy      = 1.3   # important, but rarely decides a teamfight
soldier  = 1.2
scout    = 1.15  # above Engineer; no KOTH override, and measured twice -- see above
engineer = 1.1

# Killing a player on the DEFENDING side of an attack/defence map (every
# payload map, and those listed under [attack_defend]). Only the classes listed
# change; the rest keep the values above. Proposed, not yet agreed: a defending
# Engineer's sentry holds the defence, and Scout drops back below Engineer.
[victim_value.defending]
engineer = 1.6
scout    = 1.0

# Per-map values, for both sides or the defending side only. Keys match the
# start of the map name, so versions do not matter. None set yet, for example:
#
#   [victim_value.map.pl_vigil]
#   sniper = 1.5
#
#   [victim_value.map.pl_vigil.defending]
#   engineer = 1.8

# Control-point maps with an attacking and a defending side, matched by the
# start of the name. Payload maps always count and need no entry.
[attack_defend]
maps = ["cp_steel", "cp_gravelpit", "cp_dustbowl", "cp_egypt", "cp_gorge", "cp_junction", "cp_mountainlab"]

[general]
# An assist counts for this share of the equivalent kill.
assist_share = 0.5
# Performances shorter than this on their main class are not rated: too little
# time to say anything.
min_minutes = 5.0
# Two ratings closer together than this count as an even matchup. On the
# rating scale, where one standard deviation is 0.25, this is about the five
# percentile points it used to be.
even_margin = 0.06

# ---------------------------------------------------------------------------
# Class models (v1)
#
# Each component is scored as a percentile against every other player's
# performances on that class in your stored matches -- excluding your own, so
# you are rated against the players you actually face. The rating is the
# weighted average of those percentiles, put on the scale HLTV uses: 1.00 is
# an average game, and a standard deviation either way is worth 0.25.
#
# Weights need not sum to 1; they are normalised. A component the log did not
# record (e.g. headshots on an old log) is dropped and the rest renormalised.
#
# Components:
#   impact_kills    kills weighted by victim class, per 10 min
#   impact_assists  assists weighted the same way, per 10 min
#   medic_picks     enemy Medics killed, per 10 min
#   duel            kills on the enemy Sniper minus deaths to them, per 10 min
#   headshot_share  share of kills that were headshots
#   backstabs       per 10 min
#   heal            healing per minute
#   ubers           per 10 min
#   drops           per 10 min (lower is better)
#   caps            points captured, per 10 min
#   deaths          per 10 min (lower is better)
#   dpm             damage per minute
# ---------------------------------------------------------------------------

# v2, fitted against who won. In the 679 matches with one rated Sniper a
# side, a model of these picks the winning team 71% of the time against 68%
# for v1. Fitted jointly, the duel and headshot share point the wrong way
# once kills and deaths are known, so they are cut; DPM goes up on the
# players' (and function's) say, since it cost nothing in accuracy.
# Opening duels and untraded kills come from the fights pass (PLAN §11 B).
#
# v3 (PLAN §12 step 1): deaths in context. A death your team trades within
# 3 s is not counted (HLTV's traded-death rule), and deaths to a Scout, Spy
# or Soldier cost a little extra. `hl validate sniper`: 72.4% of winners
# picked, and 71.3% on matches since Season 34 against 69.3% for v2.
# "Stationary" deaths were tried and predict nothing, so they stay out.
#
# v4 (PLAN §12 step 2): Fight KAST, the share of fights with a kill, assist,
# survival or traded death (HLTV's KAST, per fight). 73.2% of winners picked,
# 72.3% since Season 34 against 71.3% for v3. Counting survival only after a
# shot fired validated worse, so surviving a fight counts as it is.
# Output (kills, DPM, deaths) 60%, impact 40%: HLTV's balance.
# PLAN §12 step 3: what a kill counts for, by the numbers just before it
# (the killer's team alive minus the victim's, -4 to +4) and the uber
# advantage (rows: the victim's team holds it, neither does, the killer's).
#
# Measured over 193,626 kills in 736 logs (`hl situation`): a kill at four up
# lifts the chance of winning the round by a fifth as much as a kill at even
# numbers, and one at three up by four fifths. Only that clean-up discount is
# kept. The full measured tables, down-a-man kills included, were no better at
# picking match winners, and their thin states were noisy.
[situation]
theirs = [1, 1, 1, 1, 1, 1, 1, 0.75, 0.5]
none   = [1, 1, 1, 1, 1, 1, 1, 0.75, 0.5]
ours   = [1, 1, 1, 1, 1, 1, 1, 0.75, 0.5]

# ---------------------------------------------------------------------------
# Q8: a model per class
#
# Until September 2026 three classes had a model and the other six shared
# `generic` -- kills, damage, deaths, assists, caps, in fixed proportions
# nobody had ever checked. A Pyro was rated as though he were a Soldier with
# a worse gun.
#
# Every class now has its own, and each one was produced the same way:
#
#   1. `hl validate <class>` builds a pair from every decided match -- one
#      player of that class a side, which Highlander guarantees -- and scores
#      every component that means anything for the class.
#   2. A logistic fit says which components still predict the winner once the
#      others are known.
#   3. Those coefficients are rounded into weights (`validate::propose`):
#      negatives dropped, anything under a fifth of the largest dropped, the
#      rest normalised and rounded to 0.05. Coarse on purpose -- a model
#      written to three decimals is a fit pretending to be an opinion.
#   4. Five-fold cross-validation over blocks of time scores the *procedure*,
#      so the number quoted is not one it was tuned on.
#
# Cross-validated, picking the winner, against what rated the class before:
#
#   class     was    now       class     was    now
#   scout     70.7   74.5      engineer  71.8   73.4
#   soldier   72.2   73.2      medic     71.1   75.4
#   pyro      73.5   78.0      spy       71.0   72.9
#   demoman   72.0   75.6      sniper    72.9   75.9
#   heavy     72.0   76.8
#
# Two findings worth keeping, because each contradicts something:
#
# **Damage per minute earns its place nowhere.** Added to every one of these
# models at 0.10 it moved accuracy by between -0.6 and +0.3 points -- noise,
# in both directions. It is not that damage does not matter; it is that its
# value reaches the rating twice already, as the kills it sets up (impact
# kills) and as the ones it hands a teammate (impact assists). DPM survives
# only in `generic`, where it is a fallback and not a claim. This is the
# second time DPM has been measured and found redundant (see v2 above).
#
# **Staying alive predicts winning almost too well.** Left to itself the fit
# gave the Sniper 0.55 and the Medic 0.65 to death-shaped components, and a
# rating that is mostly "who died less" inherits the team's result rather
# than describing the player. So: no model gives dying more than half its
# weight, and `no_model_is_mostly_about_dying` holds every one of the nine to
# it. The Sniper's cap costs 0.2 points and the Medic's 1.6. A tighter cap of
# 0.45 was tried and costs another 1.0 on the Demoman and 2.5 on the Medic,
# which is too much to pay for a rounder number.
# ---------------------------------------------------------------------------

# Cross-validated 75.9%, against 72.9% for v6 and 68.0% for v1.
#
# The fit removes what v2 to v4 had put in -- the duel, headshot share,
# opening duels, Fight KAST, DPM -- not because they say nothing (Fight KAST
# alone picks 72.4% of winners) but because deaths, untraded deaths and
# valued kills already contain them. What is left is the shape of a Sniper's
# game: what his picks were worth, and how often he was the one picked.
# Survival is 0.45 here; the uncapped fit wanted 0.55 and scored 0.2 better.
[model.sniper]
impact_kills    = 0.25
deaths          = 0.25
untraded        = 0.10
untraded_deaths = 0.15
flank_deaths    = 0.05
situation_kills = 0.20

# Cross-validated 74.5%, against 70.7% on `generic`.
#
# Assists as heavy as kills, which is the Scout read exactly: he arrives
# first, takes someone to half health and leaves the kill to the Soldier
# behind him. Caps are in at 0.05 because a Scout capping is a Scout doing
# the job nobody else on the team can do twice as fast.
[model.scout]
impact_kills    = 0.20
impact_assists  = 0.20
medic_picks     = 0.05
caps            = 0.05
deaths          = 0.20
untraded        = 0.05
untraded_deaths = 0.15
situation_kills = 0.10

# Cross-validated 73.2%, against 72.2% on `generic` -- the smallest gain of
# the nine, and the plainest model. The Soldier's contribution to winning is
# the ordinary one: kill people, set up kills, stay up. Nothing class-shaped
# survived the fit, and nothing was added to make the table look fuller.
[model.soldier]
impact_kills    = 0.35
impact_assists  = 0.20
deaths          = 0.20
untraded_deaths = 0.25

# Cross-validated 78.0%, against 73.5% on `generic` -- the largest gain of
# the nine, and the clearest case for Q8 existing at all. A Pyro rated on
# kills and damage is rated on the two things he is worst at. What he is
# actually paid for is here: assists (the spam and the airblast that make
# someone else's kill), holding the point, and being alive when the push
# comes. His own kills carry 0.20 between them, less than his assists.
[model.pyro]
impact_kills    = 0.15
impact_assists  = 0.20
medic_picks     = 0.05
caps            = 0.15
deaths          = 0.20
untraded_deaths = 0.20
situation_kills = 0.05

# Cross-validated 75.6%, against 72.0% on `generic`.
#
# Fight KAST, engaged is the Demoman's alone among the nine: he is the class
# that is in every fight and is measured by whether the fight went his team's
# way, not by whether he got the kill. Deaths to flankers at 0.10 is the
# Scout and Spy problem stated as a number -- a Demoman who dies to the flank
# is a Demoman whose team has no damage for the next ten seconds.
[model.demoman]
impact_kills       = 0.15
impact_assists     = 0.05
medic_picks        = 0.10
deaths             = 0.30
untraded           = 0.05
untraded_deaths    = 0.10
flank_deaths       = 0.10
fight_kast_engaged = 0.15

# Cross-validated 76.8%, against 72.0% on `generic`.
#
# The heaviest kill weight of the nine, which is right: a Heavy who is not
# killing people is a Heavy who is walking. Medic picks at 0.10 because the
# Heavy is the class that can hold an angle on the enemy Medic and win it.
# Deaths to flankers is here for the Demoman's reason and a stronger one: a
# dead Heavy takes half a minute to matter again.
[model.heavy]
impact_kills       = 0.30
medic_picks        = 0.10
untraded           = 0.05
untraded_deaths    = 0.25
flank_deaths       = 0.10
fight_kast_engaged = 0.10
situation_kills    = 0.10

# Cross-validated 73.4%, against 71.8% on `generic`.
#
# Caps at 0.20, the highest of the nine, and it is not really about capping:
# it is the only thing in the log that knows the Engineer's buildings were
# where the team needed them. Assists as heavy as kills, because a sentry
# that softens a push is an assist and a sentry that kills is a bonus.
#
# The Engineer is still the class logs.tf reads worst -- no sentry damage, no
# teleporter uses, no building placement. This is the best model available
# from what a log says, which is not the same as a good measure of an
# Engineer.
[model.engineer]
impact_kills    = 0.20
impact_assists  = 0.20
caps            = 0.20
deaths          = 0.10
opening         = 0.05
untraded        = 0.05
untraded_deaths = 0.20

# Cross-validated 75.4%, against 71.1% for the old hand-written model and
# 62.6% on `generic` -- the class `generic` failed hardest, which is what you
# would expect of a model built around kills for a class that does not take
# the shot.
#
# JUDGEMENT, stated because it goes against the fit. Left alone the fit gives
# deaths 0.45 and untraded deaths 0.20 and drops ubers and drops entirely:
# both are collinear with dying, since a Medic who dies does not build and a
# drop is a death with an uber in hand. That model scores 1.6 points better
# and no Highlander player would accept it. Drops are the first thing said
# about a Medic after a lost round, and a rating that cannot see them is not
# a Medic rating. So ubers and drops are in at 0.15 and 0.10, dying is held
# to half the model, and the 1.6 points are the price.
[model.medic]
impact_assists  = 0.10
heal            = 0.15
ubers           = 0.15
drops           = 0.10
caps            = 0.10
deaths          = 0.25
untraded_deaths = 0.15

# Cross-validated 72.9%, against 71.0% for the old hand-written model -- and
# 72.3% on `generic`, which the old Spy model *lost to*. That is the finding:
# a hand-written model can be worse than no model, and only pairing it
# against the fallback showed it.
#
# Kills not traded at 0.15 is the Spy's job stated correctly: a Spy who gets
# the Medic and dies for it has done the round's work, and one who gets a
# Soldier and is traded immediately has done nothing. Backstabs are kept at
# 0.10 -- the fit is indifferent to them because they are already inside the
# kill value, and a Spy rating with no backstabs in it is not a Spy rating.
# Adding them measured slightly better, so nothing was paid for it.
[model.spy]
impact_kills       = 0.20
impact_assists     = 0.10
backstabs          = 0.10
duel               = 0.10
headshot_share     = 0.05
untraded           = 0.15
untraded_deaths    = 0.20
fight_kast_engaged = 0.10

# The fallback, for a class with no model of its own. Every class has one as
# of Q8, so nothing reads this today -- it stays because a weights file is
# allowed to leave a class out, and because it is the bar each of the nine
# above had to clear.
[model.generic]
impact_kills   = 0.35
dpm            = 0.20
deaths         = 0.20
impact_assists = 0.15
caps           = 0.10

[swing]
# From `hl situation --swing`: winning the fight, 194025 kills in 737 logs.
# Columns: the killer's team alive minus the victim's, -4 to +4.
theirs = [0.040, 0.082, 0.097, 0.156, 0.200, 0.180, 0.169, 0.148, 0.148]
none   = [0.069, 0.102, 0.137, 0.173, 0.192, 0.167, 0.121, 0.083, 0.047]
ours   = [0.139, 0.139, 0.147, 0.147, 0.163, 0.125, 0.075, 0.065, 0.028]
