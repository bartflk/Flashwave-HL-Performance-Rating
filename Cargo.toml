[workspace]
resolver = "2"
members = ["crates/hl-core", "crates/hl-db", "crates/hl-ingest", "crates/hl-rating", "crates/hl-demos", "crates/hl-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hl-core = { path = "crates/hl-core" }
hl-db = { path = "crates/hl-db" }
hl-ingest = { path = "crates/hl-ingest" }
hl-rating = { path = "crates/hl-rating" }
hl-demos = { path = "crates/hl-demos" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's default parser is not correctly rounded, so
# a float could come back one bit-pattern away from the one written — enough
# to turn a tie in a rating baseline into a near miss, and move a percentile
# by half a rank. Everything here that stores a number stores it as JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    # Needed for `migrate!`, which only reads the migrations directory at
    # compile time. The query!/query_as! macros, which would require a live
    # database at build time, are deliberately not used.
    "macros",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
